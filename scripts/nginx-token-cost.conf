# siungo-token-cost 反向代理片段
# 接入方式：把下面 location 块复制进主站 nginx 配置的对应 server 块（443 HTTPS），然后 nginx -s reload。
# 注意：proxy_pass 末尾的 / 会剥离 /token-cost 前缀，后端 Go 服务按根路径服务，无需感知前缀。
# 可选限流：需在 nginx http 块先定义 limit_req_zone（如：
#   limit_req_zone $binary_remote_addr zone=token_calc:10m rate=60r/m;
# ）

location /token-cost/ {
    proxy_pass http://127.0.0.1:8089/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 可选：限制计算接口被刷（每 IP 每分钟 60 次，突发 20）
    # limit_req zone=token_calc burst=20 nodelay;
}
